coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Users authenticate with their own Keycloak access token (Polaris audience), over HTTPS only
# (Trino's CLI and clients refuse to send a token over HTTP); plain HTTP stays open for the
# health check and accepts no credentials. The username is the
# token's principal_name, and the default system access control refuses impersonation, so a
# client cannot run a query under a username other than its token's.
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/tmp/trino-tls.p12
http-server.https.keystore.key=${ENV:TRINO_TLS_PASSWORD}
http-server.authentication.type=JWT
http-server.authentication.jwt.key-file=http://keycloak:8080/realms/${ENV:KC_REALM}/protocol/openid-connect/certs
http-server.authentication.jwt.required-issuer=http://keycloak:8080/realms/${ENV:KC_REALM}
http-server.authentication.jwt.required-audience=${ENV:POLARIS_CLIENT_ID}
http-server.authentication.jwt.principal-field=principal_name
internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SECRET}
# The web UI cannot use the JWT authenticator; off rather than insecure.
web-ui.enabled=false

query.max-memory=2GB
query.max-memory-per-node=1GB
