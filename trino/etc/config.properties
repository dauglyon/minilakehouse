coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Dev front door: no authenticator. The end-user identity comes from the CLI
# `--user` flag (insecure dev mode). Stage B tests whether that identity
# propagates onward to Polaris via iceberg.rest-catalog.session=USER.
web-ui.enabled=true
web-ui.authentication.type=insecure

query.max-memory=2GB
query.max-memory-per-node=1GB
