coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Dev front door: no authenticator. The end-user identity comes from the CLI `--user` flag
# (insecure dev mode); session=USER (in iceberg.properties) propagates it onward to Polaris.
web-ui.enabled=true
web-ui.authentication.type=insecure

query.max-memory=2GB
query.max-memory-per-node=1GB
