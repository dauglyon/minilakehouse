# Every completed statement, with its inputs and output (ioMetadata), to governance's internal
# listener, which knows Trino by its client certificate and drafts declarations from them
# (docs/HANDOFF-2026-10-22-groups.md section 4). A draft changes no one's access.
event-listener.name=http
http-event-listener.log-completed=true
http-event-listener.connect-ingest-uri=https://governance:8443/internal/drafts
http-event-listener.connect-retry-count=3
http-event-listener.http-client.key-store-path=/pki/client.pem
http-event-listener.http-client.trust-store-path=/pki/ca.crt
