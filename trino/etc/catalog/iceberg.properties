connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=lakehouse

# Connect to Polaris via OAUTH2. session=USER propagates the end user (Trino `--user`) to
# the catalog, so Polaris's OPA authorizer sees the real user (e.g. alice) as
# input.actor.principal — not just the trino service account.
iceberg.rest-catalog.security=OAUTH2
# Token endpoint = the idp-shim, not Keycloak. The shim mints Trino's service token
# (client-credentials) and, per user, a real signed token for the end user that it
# exchanges from Trino's unsigned session assertion.
iceberg.rest-catalog.oauth2.server-uri=http://idp-shim:9000/token
# The engine proves itself to the shim with a DEDICATED secret (not the Keycloak client
# secret users log in with) — sourced from the container env so it stays single-sourced.
iceberg.rest-catalog.oauth2.credential=trino:${ENV:SHIM_ENGINE_SECRET}
iceberg.rest-catalog.session=USER

# Read table files with the credential Polaris vends at loadTable (a per-table STS credential
# scoped to that table's files).
iceberg.rest-catalog.vended-credentials-enabled=true

fs.native-s3.enabled=true
s3.endpoint=http://ceph:8080
s3.path-style-access=true
s3.region=us-east-1
