connector.name=iceberg
iceberg.catalog.type=rest
# Through the gate (gate/app.py), so a table someone may view but not read still loads.
iceberg.rest-catalog.uri=http://gate:8182/api/catalog
iceberg.rest-catalog.warehouse=lakehouse

# session=USER builds one catalog session per user and query, carrying the query's extra
# credentials. A client that attaches its token as the extra credential `token` has that
# token sent to Polaris as the bearer, unexchanged (Iceberg OAuth2Manager), so Polaris and OPA
# decide on the person's own token. A query without it falls back to exchanging Trino's
# unsigned user assertion, which Keycloak refuses.
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.session=USER
# Trino's own catalog calls (no user): client credentials as service-account-trino, which OPA
# grants nothing.
iceberg.rest-catalog.oauth2.server-uri=http://keycloak:8080/realms/${ENV:KC_REALM}/protocol/openid-connect/token
iceberg.rest-catalog.oauth2.credential=${ENV:TRINO_CLIENT_ID}:${ENV:TRINO_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=openid

# Read table files with the credential Polaris vends at loadTable (a per-table STS credential
# scoped to that table's files).
iceberg.rest-catalog.vended-credentials-enabled=true

fs.native-s3.enabled=true
# One storage address, with the bucket in the host name (<bucket>.storage.internal), as AWS S3 routes
# buckets: Docker DNS sends the lakehouse bucket to Ceph and the dataset index's bucket to
# governance (ceph/rgw-entrypoint.sh, governance/index_table.py).
s3.endpoint=http://storage.internal:8080
s3.path-style-access=false
s3.region=us-east-1
