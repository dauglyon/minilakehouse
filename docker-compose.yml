# minilakehouse — a unified lakehouse PDP. One policy brain (OPA); every other service
# either asks OPA (PEP) or obeys a credential it gated (vending). Flows A (discovery),
# B (Iceberg tables via Trino->Polaris->OPA->RGW STS), C (blob datasets via the broker).

services:

  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks: [default, catalog]
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15

  keycloak:
    image: ${KEYCLOAK_IMAGE}
    # Standard token exchange (on by default) lets the `trino` client trade a user's
    # still-valid token for a fresh one; Trino's Iceberg client uses it to refresh a query's
    # token before expiry. Enabled per client in the realm file.
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/realm-lakehouse.json:/opt/keycloak/data/import/realm-lakehouse.json:ro
    networks: [default, catalog]
    ports:
      - "18080:8080"
    healthcheck:
      test: "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 5s
      timeout: 2s
      retries: 30

  governance-bootstrap:
    # One-shot: create the dedicated `governance` database in the existing Postgres
    # server (idempotently). Mirrors polaris-bootstrap. There are no init scripts and the
    # postgres_data volume persists across `down`, so the DB must be created at runtime —
    # the \gexec trick CREATEs only when pg_database lacks it.
    image: ${POSTGRES_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -v ON_ERROR_STOP=1 <<'EOSQL'
        SELECT 'CREATE DATABASE governance' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'governance')\gexec
        EOSQL

  rgw-setup:
    # One-shot, admin-credentialed RGW config so the long-lived governance service never
    # holds the admin key: grants governance-reader ListBucket on datasets/* (bucket policy)
    # and wires bucket notifications -> governance /events. See governance/rgw_setup.py.
    build: ./governance
    depends_on:
      ceph-setup:
        condition: service_completed_successfully
    environment:
      RGW_ENDPOINT: http://ceph:8080
      RGW_ACCESS_KEY: ${RGW_ACCESS_KEY}
      RGW_SECRET_KEY: ${RGW_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      GOVERNANCE_READER_UID: governance-reader
      # Reader creds too, so the one-shot can confirm the reader can actually list before exiting.
      GOVERNANCE_READER_KEY: ${GOVERNANCE_READER_KEY}
      GOVERNANCE_READER_SECRET: ${GOVERNANCE_READER_SECRET}
      EVENTS_ENDPOINT: http://governance:8000/events
    command: ["python", "rgw_setup.py"]

  governance:
    # The PAP + dataset registry. Single source of truth: owns the registry + all grants
    # in a durable Postgres database; OPA's rules fetch them from /internal/* per decision.
    # Serves the dataset index (Flow A). See governance/app.py.
    build: ./governance
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      governance-bootstrap:
        condition: service_completed_successfully
      rgw-setup:
        condition: service_completed_successfully
      pki:
        condition: service_completed_successfully
    environment:
      REGISTRY: /app/registry.json
      OPA_BASE: http://opa:8181
      GOVERNANCE_DB_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/governance
      LIFECYCLE_TOKEN: ${LIFECYCLE_TOKEN}   # bearer the gate presents to report table creates/drops
      # Creating each person's Polaris principal on first use (POST /principals/me).
      POLARIS_URL: http://polaris:8181
      POLARIS_REALM: ${POLARIS_REALM}
      PROVISIONER_CLIENT_ID: ${PROVISIONER_CLIENT_ID}
      PROVISIONER_CLIENT_SECRET: ${PROVISIONER_CLIENT_SECRET}
      KEYCLOAK_JWKS: http://keycloak:8080/realms/${KC_REALM}/protocol/openid-connect/certs
      KEYCLOAK_ISS: http://keycloak:8080/realms/${KC_REALM}
      # Least-privilege reader (ListBucket on datasets/* only) — NOT the RGW admin key.
      RGW_ENDPOINT: http://ceph:8080
      RGW_ACCESS_KEY: ${GOVERNANCE_READER_KEY}
      RGW_SECRET_KEY: ${GOVERNANCE_READER_SECRET}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./seed:/seed:ro   # for the register-at-ingest demo (seed/ingest-demo.py)
      # Server certificate for the grant-lookup listener (port 8443), which accepts only OPA.
      - pki_governance:/pki:ro
    networks:
      # Serves the dataset index's files on port 8080 by bucket-in-hostname addressing
      # (governance/index_table.py).
      default:
        aliases: [governance-index.storage.internal]
      policy: {}
      catalog: {}
    ports:
      - "19092:8000"

  opa:
    image: ${OPA_IMAGE}
    # Policy only, from the mount. OPA holds no grants: its rules fetch them from governance
    # per decision (opa/governance.rego).
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=debug", "/policies"]
    depends_on:
      pki:
        condition: service_completed_successfully
    environment:
      # Read by opa/governance.rego through opa.runtime().env.
      GOVERNANCE_URL: https://governance:8443
    volumes:
      - ./opa:/policies:ro
      # OPA's client certificate for governance's grant lookups. Files, not environment
      # variables: OPA's query API can read its environment but not its files.
      - pki_opa:/pki:ro
    # OPA's API answers anyone who reaches it: any query, including its environment and every
    # grant through governance. So it sits only on `policy`, with its callers (polaris,
    # broker, governance, gate), and publishes no host port.
    networks: [policy]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8181/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak-setup:
    # One-shot: one token audience per service, as optional client scopes on the login
    # client (keycloak/setup.py). Safe to rerun.
    build: ./governance
    entrypoint: ["python", "/keycloak/setup.py"]
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KC_REALM: ${KC_REALM}
      KC_ADMIN: ${KC_ADMIN}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/setup.py:/keycloak/setup.py:ro

  pki:
    # One-shot: a dev CA, governance's server certificate and OPA's client certificate, each
    # on its own volume (governance/pki.py). Keeps existing files on a rerun.
    build: ./governance
    entrypoint: ["python", "/app/pki.py"]
    network_mode: none
    volumes:
      - pki_ca:/pki/ca
      - pki_governance:/pki/governance
      - pki_opa:/pki/opa

  broker:
    # Blob vending broker (Flow C: blob datasets). The true end-to-end plane: clients present
    # their OWN Keycloak token, the broker verifies it, asks OPA yes/no on the named
    # dataset, and vends an STS credential narrowed (session policy) to that dataset's
    # prefix. See broker/app.py.
    build: ./broker
    depends_on:
      keycloak:
        condition: service_healthy
      ceph:
        condition: service_healthy
      opa:
        condition: service_started
      governance:
        condition: service_healthy
    environment:
      KEYCLOAK_JWKS: http://keycloak:8080/realms/${KC_REALM}/protocol/openid-connect/certs
      KEYCLOAK_ISS: http://keycloak:8080/realms/${KC_REALM}
      OPA_BLOB_URL: http://opa:8181/v1/data/lakehouse/blob
      RGW_ENDPOINT: http://ceph:8080
      BLOB_ROLE_ARN: ${BLOB_ROLE_ARN}
      BLOB_WRITE_ROLE_ARN: ${BLOB_WRITE_ROLE_ARN}
      BUCKET: ${S3_BUCKET}
      BLOB_BROKER_KEY: ${BLOB_BROKER_KEY}
      BLOB_BROKER_SECRET: ${BLOB_BROKER_SECRET}
    networks: [default, policy]
    ports:
      - "19091:9100"

  ceph:
    image: ${CEPH_IMAGE}
    environment:
      RGW_PORT: "8080"
      RGW_ACCESS_KEY: ${RGW_ACCESS_KEY}
      RGW_SECRET_KEY: ${RGW_SECRET_KEY}
      RGW_STS_KEY: ${RGW_STS_KEY}
      # Keys of the RGW users ceph/sts-bootstrap.sh keeps in step with .env at every start.
      POLARIS_S3_KEY: ${POLARIS_S3_KEY}
      POLARIS_S3_SECRET: ${POLARIS_S3_SECRET}
      BLOB_BROKER_KEY: ${BLOB_BROKER_KEY}
      BLOB_BROKER_SECRET: ${BLOB_BROKER_SECRET}
      GOVERNANCE_READER_KEY: ${GOVERNANCE_READER_KEY}
      GOVERNANCE_READER_SECRET: ${GOVERNANCE_READER_SECRET}
    entrypoint: ["/bin/sh", "/rgw-entrypoint.sh"]
    volumes:
      - ./ceph/rgw-entrypoint.sh:/rgw-entrypoint.sh:ro
      - ./ceph/start.sh:/ceph-start.sh:ro
      - ./ceph/sts-bootstrap.sh:/sts-bootstrap.sh:ro
      # The cluster (MON store, BlueStore OSD file), so data survives restarts and recreation.
      - ceph_data:/var/lib/ceph
    networks:
      # Engines read storage at one address with the bucket in the host name:
      # <bucket>.storage.internal resolves here, governance-index.storage.internal to
      # governance (ceph/rgw-entrypoint.sh).
      default:
        aliases: [storage.internal, "${S3_BUCKET}.storage.internal"]
      catalog: {}
    ports:
      - "19000:8080"
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 8s
      retries: 20

  ceph-setup:
    image: ${MC_IMAGE}
    depends_on:
      ceph:
        condition: service_healthy
    environment:
      MC_ENDPOINT: http://ceph:8080
      MC_ACCESS_KEY: ${RGW_ACCESS_KEY}
      MC_SECRET_KEY: ${RGW_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "/ceph/bootstrap.sh"]
    volumes:
      - ./ceph/bootstrap.sh:/ceph/bootstrap.sh:ro
      - ./seed/blobs:/blobs:ro

  polaris-bootstrap:
    image: ${POLARIS_ADMIN_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      polaris.persistence.type: relational-jdbc
      quarkus.datasource.db-kind: postgresql
      quarkus.datasource.jdbc.url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      quarkus.datasource.username: ${POSTGRES_USER}
      quarkus.datasource.password: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - |
        java -jar /deployments/polaris-admin-tool.jar bootstrap --realm=${POLARIS_REALM} --credential=${POLARIS_REALM},${POLARIS_ROOT_CLIENT_ID},${POLARIS_ROOT_CLIENT_SECRET}
        rc=$$?
        if [ $$rc -eq 3 ]; then echo "Already bootstrapped — skipping (OK)"; exit 0; fi
        exit $$rc
    networks: [catalog]

  polaris:
    image: ${POLARIS_IMAGE}
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
      opa:
        condition: service_started
      keycloak:
        condition: service_healthy
    environment:
      # --- persistence ---
      polaris.persistence.type: relational-jdbc
      quarkus.datasource.db-kind: postgresql
      quarkus.datasource.jdbc.url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      quarkus.datasource.username: ${POSTGRES_USER}
      quarkus.datasource.password: ${POSTGRES_PASSWORD}
      polaris.realm-context.realms: ${POLARIS_REALM}
      # --- storage: an RGW user whose only right is assuming the polaris-vendor role. Every
      #     file access, Polaris's own metadata reads and writes included, uses a credential
      #     from that role narrowed to one table's location. ---
      AWS_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${POLARIS_S3_KEY}
      AWS_SECRET_ACCESS_KEY: ${POLARIS_S3_SECRET}
      # --- authn: MIXED — internal root (admin/bootstrap/catalog) + external Keycloak
      #     tokens (user-facing catalog ops). The external identity's principal name
      #     comes from the token's principal_name claim. ---
      polaris.authentication.type: mixed
      quarkus.oidc.tenant-enabled: "true"
      # OIDC issuer = Keycloak. Trino forwards each user's own Keycloak token as the bearer
      # (the `token` extra credential), so Polaris validates the person's token itself.
      quarkus.oidc.auth-server-url: http://keycloak:8080/realms/${KC_REALM}
      quarkus.oidc.discovery-enabled: "true"
      quarkus.oidc.client-id: ${POLARIS_CLIENT_ID}
      quarkus.oidc.token.audience: ${POLARIS_CLIENT_ID}
      # Polaris 1.5 logs the whole credential, token included, at WARN whenever a token
      # carries a role that isn't a Polaris role the principal holds, and principals hold
      # none. So no role claim is mapped, and the filter drops every role Quarkus finds
      # anyway (Keycloak's realm roles, e.g. on the engine's service-account token), since
      # Keycloak issues none named PRINCIPAL_ROLE:. OPA receives roles: [] either way.
      # No id-claim-path: external principals are federated by NAME only (the default
      # mapper returns an empty principal-id when id-claim-path is unset). Setting it to
      # a non-numeric claim like `sub` makes Polaris try to parse the UUID as a long.
      polaris.oidc.principal-mapper.name-claim-path: principal_name
      polaris.oidc.principal-roles-mapper.filter: "PRINCIPAL_ROLE:.+"
      # --- authz: delegated to OPA (deny-by-default policy; grants fetched from governance) ---
      polaris.authorization.type: opa
      polaris.authorization.opa.policy-uri: http://opa:8181/v1/data/polaris/authz
      polaris.authorization.opa.auth.type: none
      # --- feature flags (S3 + non-TLS RGW + OPA-preview readiness) ---
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": "[\"S3\"]"
      # RGW speaks http (no TLS) in this dev image, so allow the "insecure" S3 FileIO.
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      # Mint each table credential under the person's name (STS session polaris-<principal>),
      # so storage can attribute reads; credentials are then cached per person, not shared.
      polaris.features."INCLUDE_PRINCIPAL_NAME_IN_SUBSCOPED_CREDENTIAL": "true"
      polaris.readiness.ignore-severe-issues: "true"
      quarkus.otel.sdk.disabled: "true"
    # Reachable only through the gate (and by polaris-setup, as root): Trino and every other
    # client are on `default`, which Polaris is not on, and no host port is published.
    networks: [catalog, policy]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  polaris-setup:
    image: ${CURL_IMAGE}
    depends_on:
      polaris:
        condition: service_healthy
      ceph-setup:
        condition: service_completed_successfully
    environment:
      POLARIS_REALM: ${POLARIS_REALM}
      POLARIS_ROOT_CLIENT_ID: ${POLARIS_ROOT_CLIENT_ID}
      POLARIS_ROOT_CLIENT_SECRET: ${POLARIS_ROOT_CLIENT_SECRET}
      PROVISIONER_CLIENT_ID: ${PROVISIONER_CLIENT_ID}
      PROVISIONER_CLIENT_SECRET: ${PROVISIONER_CLIENT_SECRET}
      CATALOG_NAME: ${CATALOG_NAME}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: http://ceph:8080
      S3_REGION: ${S3_REGION}
      STS_ROLE_ARN: ${STS_ROLE_ARN}
    entrypoint: ["/bin/sh", "/polaris/bootstrap.sh"]
    volumes:
      - ./polaris/bootstrap.sh:/polaris/bootstrap.sh:ro
    # default too: the script installs jq from the internet, and `catalog` has no way out.
    networks: [default, catalog]

  gate:
    # The only way to Polaris. Verifies the caller's token, trims listings to what the caller
    # may view, turns refusals for names they may not view into not-found, loads a table
    # without a credential for a person who may view but not read it, decides which tables
    # and namespaces may be created, and reports creates and drops. See gate/app.py.
    build: ./gate
    depends_on:
      polaris:
        condition: service_healthy
      opa:
        condition: service_healthy
    environment:
      OPA_URL: http://opa:8181/v1/data/lakehouse/tables
      GOVERNANCE_URL: http://governance:8000
      LIFECYCLE_TOKEN: ${LIFECYCLE_TOKEN}
      KEYCLOAK_JWKS: http://keycloak:8080/realms/${KC_REALM}/protocol/openid-connect/certs
      KEYCLOAK_ISS: http://keycloak:8080/realms/${KC_REALM}
      POLARIS_AUDIENCE: ${POLARIS_CLIENT_ID}
    networks: [default, catalog, policy]

  trino:
    image: ${TRINO_IMAGE}
    # Trino's clients send an access token only over TLS, so the container makes a
    # self-signed dev keystore (SAN localhost, trino) at each start, replacing the previous
    # one (a restart keeps /tmp), then runs the image's own command. Clients in the
    # container verify against the same file.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        rm -f /tmp/trino-tls.p12 &&
        keytool -genkeypair -keystore /tmp/trino-tls.p12 -storetype PKCS12
        -storepass "$$TRINO_TLS_PASSWORD" -alias trino -keyalg RSA -keysize 2048
        -validity 3650 -dname CN=trino -ext SAN=dns:localhost,dns:trino &&
        exec /usr/lib/trino/bin/launcher run --etc-dir /etc/trino
    depends_on:
      keycloak-setup:
        condition: service_completed_successfully
      polaris-setup:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      gate:
        condition: service_healthy
    environment:
      # Referenced by config.properties and iceberg.properties as ${ENV:...}.
      KC_REALM: ${KC_REALM}
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID}
      TRINO_CLIENT_ID: ${TRINO_CLIENT_ID}
      TRINO_CLIENT_SECRET: ${TRINO_CLIENT_SECRET}
      TRINO_INTERNAL_SECRET: ${TRINO_INTERNAL_SECRET}
      TRINO_TLS_PASSWORD: ${TRINO_TLS_PASSWORD}
    volumes:
      - ./trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./trino/etc/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./seed:/seed:ro
    ports:
      - "8083:8080"
      - "18443:8443"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  loginproxy:
    # Keeps a person's Trino session alive past their 5-minute Keycloak token: speaks Trino's
    # external-authentication protocol to the client, holds the refresh token, and forwards a
    # fresh token to Trino as the bearer and the `token` extra credential. See login-proxy/app.py.
    build: ./login-proxy
    depends_on:
      keycloak-setup:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      TRINO_URL: https://trino:8443
      # The proxy pins Trino's self-signed cert from this host at startup, then verifies every
      # forwarded request against it.
      TRINO_PIN_HOST: trino:8443
      TRINO_CA: /tmp/trino.crt
      KC_AUTH: http://keycloak:8080/realms/${KC_REALM}/protocol/openid-connect/auth
      KC_TOKEN: http://keycloak:8080/realms/${KC_REALM}/protocol/openid-connect/token
      TRINO_CLIENT_ID: ${TRINO_CLIENT_ID}
      TRINO_CLIENT_SECRET: ${TRINO_CLIENT_SECRET}
      # How the client and the browser reach this proxy. In-network here; a deployment uses a
      # published URL. Keycloak must allow it as a redirect URI (realm file, trino client).
      PUBLIC_URL: https://loginproxy:9200
    ports:
      - "19200:9200"

networks:
  default:
  # OPA and its callers only; internal, so nothing on it reaches outside the host.
  policy:
    internal: true
  # Polaris, its backends, the gate, Polaris's setup jobs, and governance (which creates
  # each person's Polaris principal).
  catalog:
    internal: true

volumes:
  postgres_data:
  ceph_data:
  pki_ca:
  pki_governance:
  pki_opa:
